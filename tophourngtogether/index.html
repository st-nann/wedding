<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผังที่นั่งงานแต่งงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf5;--card:#fff;--tx:#2d3270;--mut:#8a8aa6;--bd:#eadfc9;--g:#3f51b5;--gs:#e8eaf9;--b:#c2476b;--bs:#fbe4ec;--gold:#c9a24b;--golds:#f7edd3;--me:#e03a3a;--zone:#f4ecfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.back{display:inline-block;color:var(--mut);font-size:.9rem;margin:4px 0 12px}
h1{font-size:1.5rem;margin:6px 0;font-weight:700}
h2{font-size:1.25rem;margin:26px 0 12px;font-weight:700}
.hero{text-align:center;padding:22px 0 8px}
.tag{color:var(--gold);font-weight:700;font-size:.9rem;letter-spacing:.02em}
.sub{color:var(--mut);margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:0 6px 24px rgba(120,100,60,.08)}
.card.gold{outline:1px solid var(--gold);outline-offset:-7px;text-align:center;padding:26px 20px}
.sbox{position:relative}
.sbox input{width:100%;padding:15px 18px;font:inherit;font-size:1.05rem;border:2px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx)}
.sbox input:focus{outline:none;border-color:var(--gold)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.dd a{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.dd a:last-child{border:0}.dd a:hover{background:var(--golds)}
.dd small,.mut{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 12px}
.btn{display:block;text-align:center;padding:16px 12px;border-radius:18px;font-weight:700;border:2px solid var(--bd);background:var(--card)}
.btn.G{background:var(--gs);border-color:var(--g);color:var(--g)}
.btn.B{background:var(--bs);border-color:var(--b);color:var(--b)}
.btn.wide{margin-top:0;border-color:var(--gold);color:var(--gold)}
.list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--bd);font-weight:600}
.item .n{color:var(--mut);font-weight:400;font-size:.88rem}
.big{font-size:7rem;line-height:1;font-weight:700;background:linear-gradient(180deg,#f3df9e,#c9a24b);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.pill{display:inline-block;padding:4px 16px;border-radius:99px;font-size:.9rem;font-weight:600}
.pill.G{background:var(--gs);color:var(--g)}.pill.B{background:var(--bs);color:var(--b)}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 40px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);min-width:0}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.av.G{background:var(--gs);color:var(--g)}.av.B{background:var(--bs);color:var(--b)}
.chip.me{border-color:var(--me);background:var(--bs)}
.tgrid{display:grid;gap:12px}
.tc{display:flex;gap:14px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--bd)}
.tn{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-weight:700;background:var(--golds);color:var(--gold);border:2px solid var(--gold)}
.tc ul{margin:6px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--mut)}
.tc b{display:block}
.mapc{padding:8px}
svg{width:100%;height:auto;display:block}
.floor{fill:var(--zone);stroke:var(--bd);stroke-width:2}
.stg{fill:var(--g);opacity:.9}
.tbl{fill:var(--card);stroke:var(--bd);stroke-width:2}
.tbl.hl{fill:var(--golds);stroke:var(--gold);stroke-width:3}
.sd{fill:var(--bd)}.sd.G{fill:var(--g)}.sd.B{fill:var(--b)}.sd.me{fill:var(--me);stroke:#fff;stroke-width:2}
.tt{fill:var(--tx);font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.lb{fill:var(--mut);font-size:13px;text-anchor:middle;dominant-baseline:central}
.rt{fill:none;stroke:var(--b);stroke-width:3.5;stroke-dasharray:1 9;stroke-linecap:round}
.empty{padding:24px;text-align:center;color:var(--mut)}
.out{display:block;text-align:center;padding:15px;margin-top:22px;border:2px solid var(--bd);border-radius:16px;font-weight:700;background:var(--card)}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes march{to{stroke-dashoffset:-10}}
@keyframes ring{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.55)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
.floor,.stg{animation:fadeup .6s backwards}
.tg{transform-box:fill-box;transform-origin:center;animation:pop .5s backwards cubic-bezier(.2,1.4,.4,1);transition:transform .2s}
.tg:hover{transform:scale(1.08)}
.pr{fill:none;stroke:var(--gold);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.rt{animation:march .8s linear infinite}
.sd.me{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
.card.gold{position:relative;overflow:hidden;animation:fadeup .7s both}
.sp{position:absolute;color:var(--gold);font-style:normal;pointer-events:none;animation:tw 2.2s ease-in-out infinite}
.big{background:linear-gradient(110deg,#c9a24b 25%,#fff0b8 45%,#c9a24b 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:pop .9s .25s backwards cubic-bezier(.2,1.4,.4,1),shine 3s 1.2s linear infinite;filter:drop-shadow(0 4px 14px rgba(201,162,75,.45))}
.pill{animation:fadeup .6s .7s backwards}
.chips .chip{animation:fadeup .5s 1s backwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--bg:#ffe6c4;--card:#fff;--tx:#332970;--mut:#7a73a8;--bd:#ffcbc4;--g:#7ba3dd;--gs:#bfd5f4;--b:#f08f84;--bs:#ffcbc4;--gold:#ef8f84;--golds:#fff9c4;--zone:#fff;--bgimg:radial-gradient(circle at 12% 8%,rgba(255,203,196,.95),transparent 55%),radial-gradient(circle at 90% 92%,rgba(255,249,196,.95),transparent 55%),linear-gradient(135deg,rgb(255,203,196),rgb(255,226,196) 50%,rgb(255,249,196));--num:linear-gradient(110deg,#332970 25%,#8d83d9 45%,#332970 65%)}

const SEATS=10,COLS=3;
const D=[],TM={};
RAW.forEach(([t,s,c,u,ns])=>{TM[t]={t,s,c,u,g:[]};ns.split(',').forEach(n=>{const x={id:D.length,name:'คุณ'+n.trim(),t,s,c,u};D.push(x);TM[t].g.push(x)})});
const TN=Object.keys(TM).map(Number).sort((a,b)=>a-b);
const MOVES={}; /* ย้ายแขก {"คุณชื่อ นามสกุล":เลขโต๊ะ} คัดลอกค่าจากแถบโหมดแก้ไข (#edit) มาวางที่นี่ */
const ALWAYS_EDIT=true; /* true = แสดงปุ่มย้ายแขกตลอด (ใช้ตอนจัดที่นั่ง) — ตั้งเป็น false ก่อนแชร์ให้แขก แล้วเปิดเองที่ #edit */
let MV=Object.assign({},MOVES),EDIT=ALWAYS_EDIT;
try{Object.assign(MV,JSON.parse(localStorage.getItem('seat-moves')||'{}'));EDIT=EDIT||localStorage.getItem('seat-edit')==='1'}catch(e){}
function moveGuest(x,t){TM[x.t].g=TM[x.t].g.filter(y=>y!==x);x.t=t;TM[t].g.push(x)}
const ADDS=[]; /* เพิ่มผู้ติดตาม [["คุณชื่อ นามสกุล",เลขโต๊ะ],...] คัดลอกจากแถบโหมดแก้ไข (#edit) มาวางที่นี่ */
let AD=ADDS.slice();
try{JSON.parse(localStorage.getItem('seat-adds')||'[]').forEach(a=>{if(!AD.some(b=>b[0]===a[0]))AD.push(a)})}catch(e){}
function addGuest(n,t){const m=TM[t],x={id:D.length,name:n,t,s:m.s,c:m.c,u:m.u};D.push(x);m.g.push(x);return x}
AD.forEach(([n,t])=>{if(TM[t]&&!D.some(y=>y.name===n))addGuest(n,+t)});
Object.entries(MV).forEach(([n,t])=>{const x=D.find(y=>y.name===n);if(x&&TM[t]&&x.t!==+t)moveGuest(x,+t)});
const grpName=m=>STRUCT[m.c][1][m.u];
const tLabel=m=>grpName(m)+' · '+S[m.s];
const ini=n=>(n.replace('คุณ','').match(/[ก-ฮA-Za-z]/)||['•'])[0];
const $app=document.getElementById('app');
const crumb=(a,cur,sd)=>`<nav class="crumb ${sd||''}">${a.map(([h,l])=>`<a href="#${h}">${l}</a>`).join('<i>›</i>')}<i>›</i><b>${cur}</b></nav>`;
const back=(h,l)=>`<a class="back" href="#${h}">‹ ${l||'ย้อนกลับ'}</a>`;

/* ---- แผนผัง ---- */
const POS={}; /* ตำแหน่งโต๊ะที่ลากแล้ว {เลขโต๊ะ:[x,y]} คัดลอกค่าจากหน้า #edit มาวางที่นี่ */
let LAY=Object.assign({},POS);
try{const sv=JSON.parse(localStorage.getItem('seat-layout')||'null');if(sv)LAY=Object.assign(LAY,sv)}catch(e){}
const grid=t=>{const i=TN.indexOf(t);return{cx:110+(i%COLS)*200,cy:150+Math.floor(i/COLS)*150,col:i%COLS}};
const pos=t=>{const o=LAY[t];return o?{cx:o[0],cy:o[1],col:-1}:grid(t)};
function mapSvg(ht,me,ed){
 const H=Math.max(...TN.map(t=>pos(t).cy))+130;
 let h=`<svg viewBox="0 0 620 ${H}" role="img" aria-label="แผนผังโต๊ะ"><rect class="floor" x="6" y="6" width="608" height="${H-12}" rx="24"/><rect class="stg" x="180" y="18" width="260" height="46" rx="12"/><text class="lb" style="fill:#fff" x="310" y="41">เวที</text><text class="lb" x="310" y="${H-22}">▲ ทางเข้า</text>`;
 if(ht){const p=pos(ht),ax=p.col===0?210:p.col===1?210:410,ex=p.col===0?p.cx+58:p.cx-58,d=p.col<0?`M310 ${H-40} L${p.cx} ${p.cy+62}`:`M${ax} ${H-40} V${p.cy} H${ex}`;
  h+=`<path class="rt" d="${d}"/>`}
 TN.forEach((t,ti)=>{const p=pos(t),m=TM[t],on=t===ht;h+=`<g class="tg" data-t="${t}" style="animation-delay:${(.1+ti*.07).toFixed(2)}s">`+(on?`<circle class="pr" cx="${p.cx}" cy="${p.cy}" r="56"/>`:'');
  h+=`<circle class="tbl ${on?'hl':''}" cx="${p.cx}" cy="${p.cy}" r="30"/>`;
  for(let i=0;i<SEATS;i++){const a=(-90+i*360/SEATS)*Math.PI/180,g=m.g[i],mine=me!=null&&g&&g.id===me;
   h+=`<circle class="sd ${g?g.s:''} ${mine?'me':''}" cx="${(p.cx+Math.cos(a)*46).toFixed(1)}" cy="${(p.cy+Math.sin(a)*46).toFixed(1)}" r="${mine?10:7}"/>`}
  h+=`${ed?'':`<a href="#table-${t}">`}<text class="tt" x="${p.cx}" y="${p.cy}">${t}</text>${ed?'':'</a>'}</g>`});
 return h+'</svg>'}

/* ---- ผลลัพธ์: โต๊ะ + ผัง + เพื่อนร่วมโต๊ะ ---- */
function result(t,me){
 const m=TM[t],g=me!=null?D[me]:null;
 const head=g?`<div class="tag">#${TITLE}</div><div class="mut">ยินดีต้อนรับ</div><b style="font-size:1.2rem">${g.name}</b><div class="sep"></div><b>โต๊ะของคุณ คือ</b>`:`<div class="tag">#${TITLE}</div><b>โต๊ะหมายเลข</b>`;
 return `<div class="card gold">${SP}${head}<div class="big">${t}</div><span class="pill ${m.s}">${tLabel(m)}</span></div>
 <h2>เส้นทางไปโต๊ะ${g?'ของคุณ':''}</h2><div class="card mapc">${mapSvg(t,me)}</div>
 <h2>นั่งโต๊ะเดียวกับ</h2><div class="chips">${m.g.map(x=>chipHtml(x,x.id===me?'me':'')).join('')}</div>
 <a class="out" href="#home">${g?'ค้นหาใหม่':'กลับหน้าแรก'}</a>`}

pages.edit=function(){EDIT=true;try{localStorage.setItem('seat-edit','1')}catch(e){}location.hash='home'};

function BAR(){const n=Object.keys(MV).length+AD.length;
 const mvs=Object.entries(MV).map(([k,t])=>`<span class="bd mvb">ย้าย ${k} → โต๊ะ ${t}${k in MOVES?'':`<button data-un="m" data-k="${k}" aria-label="ยกเลิก">✕</button>`}</span>`);
 const ads=AD.map(([k,t],i)=>`<span class="bd adb">+ เพิ่ม ${k} (โต๊ะ ${t})${ADDS.some(y=>y[0]===k)?'':`<button data-un="a" data-k="${i}" aria-label="ยกเลิก">✕</button>`}</span>`);
 return `<div class="eb"><b>โหมดแก้ไข</b><span>${n?'แก้ไขแล้ว '+n+' รายการ':'ยังไม่มีการแก้ไข'}</span>${n?`<button id="cpm">คัดลอกรายการ</button><button id="rsm">ล้างทั้งหมด</button>`:''}<a href="#exit">ออก</a>${n?`<div class="bds">${mvs.concat(ads).join('')}</div><small class="mut">บันทึกในเครื่องนี้เท่านั้น กด "คัดลอกรายการ" เพื่อนำไปใส่ในไฟล์เว็บให้ทุกคนเห็น</small><textarea readonly rows="3" hidden>${exportCode()}</textarea>`:''}</div>`}
function saveAd(){try{localStorage.setItem('seat-adds',JSON.stringify(AD))}catch(e){}}
function exportCode(){return 'const MOVES='+JSON.stringify(MV)+';\nconst ADDS='+JSON.stringify(AD)+';'}
function openMove(id){const x=D[id],ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="dlg" role="dialog"><button class="x" id="mvx" aria-label="ปิด">✕</button><h3>จัดการ</h3><p>${x.name}<br><span class="mut" id="mvc"></span></p><h4>ย้ายโต๊ะ</h4><div class="addr"><input id="mvt" type="number" inputmode="numeric" min="1" placeholder="เลขโต๊ะที่ย้ายไป"><button class="btn on" id="mvo">ย้าย</button></div><p class="err" id="mve"></p><div class="dsep"></div><h4>เพิ่มชื่อผู้ติดตาม (นั่งโต๊ะเดียวกัน)</h4><textarea id="adn" rows="3" placeholder="พิมพ์ชื่อ 1 คนต่อบรรทัด เพิ่มได้หลายคน"></textarea><button class="btn on" id="adb">เพิ่มรายชื่อ</button><p class="err" id="ade"></p></div>`;
 document.body.appendChild(ov);
 const q=k=>ov.querySelector(k),inp=q('#mvt'),er=q('#mve'),adn=q('#adn'),ae=q('#ade'),close=()=>ov.remove();
 const info=()=>{q('#mvc').textContent='ปัจจุบัน: โต๊ะ '+x.t+' ('+TM[x.t].g.length+'/'+SEATS+' คน)'};info();
 const redraw=()=>{const y=scrollY;route();scrollTo(0,y)};
 const ok=()=>{const t=+inp.value;if(!TM[t]){er.textContent='ไม่พบโต๊ะหมายเลข '+inp.value;return}if(t===x.t){er.textContent='แขกนั่งโต๊ะนี้อยู่แล้ว';return}if(TM[t].g.length>=SEATS){er.textContent='โต๊ะ '+t+' เต็มแล้ว ('+SEATS+'/'+SEATS+' คน)';return}
  moveGuest(x,t);MV[x.name]=t;saveMv();close();redraw()};
 const add=()=>{const raw=adn.value.split(/[\n,]+/).map(v=>v.trim().replace(/\s+/g,' ')).filter(Boolean);ae.className='err';
  if(!raw.length){ae.textContent='กรอกชื่ออย่างน้อย 1 คน';return}
  let added=0;const dup=[],full=[];
  raw.forEach(v=>{const n=/^คุณ/.test(v)?v:'คุณ'+v;
   if(D.some(y=>y.name===n)){dup.push(v);return}
   if(TM[x.t].g.length>=SEATS){full.push(v);return}
   addGuest(n,x.t);AD.push([n,x.t]);added++});
  if(added){saveAd();info();redraw()}
  const msg=[];if(added)msg.push('เพิ่ม '+added+' คน ที่โต๊ะ '+x.t+' แล้ว');if(dup.length)msg.push('ข้ามชื่อซ้ำ: '+dup.join(', '));if(full.length)msg.push('โต๊ะเต็ม เพิ่มไม่ได้: '+full.join(', '));
  const bad=dup.length||full.length;ae.className='err'+(added&&!bad?' ok':'');ae.textContent=msg.join(' · ');adn.value=bad?[...dup,...full].join('\n'):''};
 q('#mvx').onclick=close;q('#mvo').onclick=ok;q('#adb').onclick=add;ov.addEventListener('click',e=>{if(e.target===ov)close()});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok();if(e.key==='Escape')close()});
 adn.addEventListener('keydown',e=>{if(e.key==='Escape')close()});inp.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('.mv');if(b){e.preventDefault();openMove(+b.dataset.g);return}
 const u=e.target.closest('[data-un]');
 if(u){const k=u.dataset.k;if(u.dataset.un==='m'){delete MV[k];saveMv()}else{const r=AD.splice(+k,1)[0];if(r){delete MV[r[0]];saveMv()}saveAd()}location.reload();return}
 if(e.target.id==='cpm'){const t=e.target,fb=()=>{const ta=document.querySelector('.eb textarea');if(ta){ta.hidden=false;ta.select()}t.textContent='คัดลอกไม่สำเร็จ ให้คัดลอกข้อความที่แสดง'};
  try{navigator.clipboard.writeText(exportCode()).then(()=>{t.textContent='คัดลอกแล้ว ✓'},fb)}catch(_){fb()}}
 if(e.target.id==='rsm'){MV=Object.assign({},MOVES);try{localStorage.removeItem('seat-moves');localStorage.removeItem('seat-adds')}catch(_){}location.reload()}});
function countUp(){const e=document.querySelector('.big');if(!e)return;const n=+e.textContent,t0=performance.now();(function f(t){const k=Math.min((t-t0)/900,1);e.textContent=Math.max(1,Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(t0)}
function route(){
 const p=(location.hash||'#home').slice(1).split('-'),k=p[0],n=p.slice(1).map((v,i)=>i===0&&(k==='side'||k==='cat'||k==='sub')?v:+v);
 (pages[k]||nf)(...n);$app.insertAdjacentHTML('afterbegin',(EDIT?BAR():'')+HDR);window.scrollTo(0,0);countUp()}
(function(){const box=document.getElementById('petals');if(!box)return;
const cols=[['#f6a5b0','#fff3a0'],['#bfd5f4','#fff9c4'],['#ffffff','#ffd7a0','#f0c4c0'],['#fff3a0','#f6a5b0','#e8d36a']];
const mk=(p,c,st)=>{let g='';for(let i=0;i<5;i++){const a=(i*72-90)*Math.PI/180;g+=`<circle cx='${(12+6.2*Math.cos(a)).toFixed(1)}' cy='${(12+6.2*Math.sin(a)).toFixed(1)}' r='4.6'/>`}
return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='${p}' stroke='${st||'none'}' stroke-width='.6'>${g}</g><circle cx='12' cy='12' r='3' fill='${c}'/></svg>`)}")`};
for(let i=0;i<18;i++){const k=cols[i%4],e=document.createElement('span');e.className='fl';const z=11+Math.random()*13;
e.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${z.toFixed(0)}px;height:${z.toFixed(0)}px;background-image:${mk(k[0],k[1],k[2])};animation-duration:${(9+Math.random()*10).toFixed(1)}s;animation-delay:-${(Math.random()*18).toFixed(1)}s;--sw:${(Math.random()*80-40).toFixed(0)}px`;box.appendChild(e)}})();
addEventListener('hashchange',route);route();
</script>
</body>
</html>
